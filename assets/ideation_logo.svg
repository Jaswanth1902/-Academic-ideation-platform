<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-i-logo" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181512" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0E0C0A" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#080706" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-i-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B36"/>
    </linearGradient>
    <style>
      .serif-display { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Georgia', serif; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <rect width="400" height="400" fill="#080706"/>
  <rect width="400" height="400" fill="url(#vignette-i-logo)"/>

  <!-- Outer Border -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.4"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="3,5" stroke-opacity="0.25"/>

  <!-- Arbor Scientiae & Compass Rings -->
  <g transform="translate(200, 200)" stroke="#C5A059" fill="none">
    <circle cx="0" cy="0" r="145" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="115" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.25"/>
    <line x1="-155" y1="0" x2="155" y2="0" stroke-width="0.4" stroke-opacity="0.2"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke-width="0.4" stroke-opacity="0.2"/>

    <!-- Tree Branches in Vector -->
    <path d="M0,80 L0,0 Q-25,-35 -55,-65" stroke="url(#gold-i-logo)" stroke-width="1.1"/>
    <path d="M0,0 Q25,-35 55,-65" stroke="url(#gold-i-logo)" stroke-width="1.1"/>
    <path d="M0,0 L0,-75" stroke="url(#gold-i-logo)" stroke-width="1.1"/>

    <circle cx="-55" cy="-65" r="3" fill="#E8C97A" stroke="none"/>
    <circle cx="55" cy="-65" r="3" fill="#E8C97A" stroke="none"/>
    <circle cx="0" cy="-75" r="3" fill="#E8C97A" stroke="none"/>

    <!-- Luxury Monogram 'A' -->
    <text x="0" y="48" fill="#FDFBF7" font-size="88" text-anchor="middle" class="serif-display" stroke="none">A</text>

    <text x="0" y="85" fill="#C5A059" font-size="8" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.7">ACADEMIA</text>
    <text x="0" y="98" fill="#C5A059" font-size="6" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.4">ARBOR SCIENTIAE</text>
  </g>
</svg>