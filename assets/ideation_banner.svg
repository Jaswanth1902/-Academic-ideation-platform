<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-acad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181412" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0F0C0A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080706" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-acad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B36"/>
    </linearGradient>
    <style>
      .serif-title { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Baskerville', 'Georgia', serif; font-weight: 400; }
      .serif-sub { font-family: 'Cormorant Garamond', 'Baskerville', 'Georgia', serif; font-style: italic; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="#080706"/>
  <rect width="1200" height="420" fill="url(#vignette-acad)"/>

  <!-- Architectural Frame -->
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="1144" height="364" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="4,6" stroke-opacity="0.2"/>

  <!-- Corner Rosettes -->
  <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
    <path d="M20 24 h16 M24 20 v16"/>
    <path d="M1180 24 h-16 M1176 20 v16"/>
    <path d="M20 396 h16 M24 392 v16"/>
    <path d="M1180 396 h-16 M1176 392 v16"/>
    <circle cx="24" cy="24" r="3" fill="none"/>
    <circle cx="1176" cy="24" r="3" fill="none"/>
    <circle cx="24" cy="396" r="3" fill="none"/>
    <circle cx="1176" cy="396" r="3" fill="none"/>
  </g>

  <!-- Da Vinci Arbor Scientiae (Tree of Scientific Knowledge & Hypothesis Branching) -->
  <g transform="translate(220, 210)" stroke="#C5A059" fill="none">
    <!-- Blueprint Radial Concentrics -->
    <g stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2,4">
      <circle cx="0" cy="0" r="160"/>
      <circle cx="0" cy="0" r="115"/>
      <circle cx="0" cy="0" r="70"/>
      <line x1="-170" y1="0" x2="170" y2="0"/>
      <line x1="0" y1="-150" x2="0" y2="150"/>
    </g>

    <!-- Branching Hypothesis Tree (Vector Linework) -->
    <g stroke="url(#gold-acad)" stroke-width="1.1">
      <!-- Root Trunk -->
      <line x1="0" y1="120" x2="0" y2="30"/>
      <!-- Primary Academic Branches -->
      <path d="M0,30 Q-30,-20 -70,-50"/>
      <path d="M0,30 Q30,-20 70,-50"/>
      <path d="M0,30 L0,-70"/>
      <!-- Secondary Sub-Branches (Divergent Ideation) -->
      <path d="M-70,-50 Q-100,-80 -120,-110" stroke-width="0.8"/>
      <path d="M-70,-50 Q-50,-90 -45,-120" stroke-width="0.8"/>
      <path d="M0,-70 Q-25,-105 -15,-135" stroke-width="0.8"/>
      <path d="M0,-70 Q25,-105 15,-135" stroke-width="0.8"/>
      <path d="M70,-50 Q50,-90 45,-120" stroke-width="0.8"/>
      <path d="M70,-50 Q100,-80 120,-110" stroke-width="0.8"/>
    </g>

    <!-- Knowledge Nodes & Constellation Stars -->
    <g fill="#E8C97A" stroke="none">
      <circle cx="0" cy="120" r="3"/>
      <circle cx="0" cy="30" r="3.5"/>
      <circle cx="-70" cy="-50" r="3"/>
      <circle cx="70" cy="-50" r="3"/>
      <circle cx="0" cy="-70" r="3"/>
      <circle cx="-120" cy="-110" r="2.5"/>
      <circle cx="-45" cy="-120" r="2.5"/>
      <circle cx="-15" cy="-135" r="2.5"/>
      <circle cx="15" cy="-135" r="2.5"/>
      <circle cx="45" cy="-120" r="2.5"/>
      <circle cx="120" cy="-110" r="2.5"/>
    </g>

    <!-- Quad-Axis Feasibility Coordinates -->
    <g stroke="#C5A059" stroke-width="0.6" opacity="0.4">
      <line x1="-130" y1="0" x2="-110" y2="0"/>
      <text x="-140" y="3" fill="#C5A059" font-size="7" text-anchor="end" class="mono-tech">NOVELTY</text>

      <line x1="110" y1="0" x2="130" y2="0"/>
      <text x="140" y="3" fill="#C5A059" font-size="7" class="mono-tech">FEASIBILITY</text>

      <line x1="0" y1="-140" x2="0" y2="-125"/>
      <text x="0" y="-146" fill="#C5A059" font-size="7" text-anchor="middle" class="mono-tech">RIGOR</text>

      <line x1="0" y1="125" x2="0" y2="140"/>
      <text x="0" y="152" fill="#C5A059" font-size="7" text-anchor="middle" class="mono-tech">IMPACT</text>
    </g>

    <!-- Annotations -->
    <text x="-165" y="-140" fill="#C5A059" opacity="0.4" font-size="9" class="mono-tech">FIG. III — ARBOR SCIENTIAE</text>
    <text x="-165" y="165" fill="#C5A059" opacity="0.4" font-size="8" class="mono-tech">HYPOTHESIS GRAPH • arXiv INGESTION</text>
  </g>

  <!-- Typography (Center-Right Cluster) -->
  <g transform="translate(460, 0)">
    <!-- Supertitle -->
    <text x="0" y="125" fill="#C5A059" font-size="12" letter-spacing="4" class="serif-title" opacity="0.85">
      AUTONOMOUS RESEARCH ENGINE &amp; LITERATURE ATLAS
    </text>

    <!-- Main Title -->
    <text x="0" y="185" fill="#FDFBF7" font-size="46" letter-spacing="10" class="serif-title">
      ACADEMIA
    </text>

    <!-- Bohemian Divider -->
    <g transform="translate(0, 210)" stroke="#C5A059" opacity="0.6">
      <line x1="0" y1="0" x2="420" y2="0" stroke-width="0.8"/>
      <circle cx="210" cy="0" r="3" fill="#C5A059"/>
      <circle cx="105" cy="0" r="1.5" fill="#C5A059"/>
      <circle cx="315" cy="0" r="1.5" fill="#C5A059"/>
    </g>

    <!-- Subtitle -->
    <text x="0" y="245" fill="#C5BEB3" font-size="15" letter-spacing="2" class="serif-title" opacity="0.9">
      QUAD-AXIS FEASIBILITY • HYPOTHESIS DIVERGENCE • CITATION GRAPH
    </text>

    <text x="0" y="275" fill="#8C857B" font-size="13" class="serif-sub">
      A systematic discovery engine transforming unstructured literature into verified research directions.
    </text>

    <!-- Badges -->
    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="130" height="24" rx="2" fill="#151311" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="65" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">arXiv-POWERED</text>

      <rect x="142" y="0" width="135" height="24" rx="2" fill="#151311" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="209" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">4-AXIS SCORING</text>

      <rect x="289" y="0" width="145" height="24" rx="2" fill="#151311" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="361" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">NOVELTY METRIC</text>
    </g>

    <text x="0" y="365" fill="#5C564E" font-size="9" letter-spacing="2" class="mono-tech">
      EX SCIENTIA VERITAS • ANNO MMXXVI • OPEN SOURCE LABS
    </text>
  </g>
</svg>