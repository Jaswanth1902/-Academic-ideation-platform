version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8055:8055"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8055
      - SQLITE_DB_PATH=/app/data/academic_ideation.db
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
